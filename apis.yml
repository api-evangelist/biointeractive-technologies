aid: biointeractive-technologies
name: BioInteractive Technologies
description: BioInteractive Technologies operates Tenzr Health, a configurable digital
  care layer that helps health systems, rehabilitation programs, orthopedic groups,
  and therapy organizations extend care beyond the clinic. The platform gives patients
  structured guidance, education, tasks, check-ins, and recovery support while giving
  clinicians better visibility into patient progress, adherence, symptoms, and recovery
  signals across the episode of care. Tenzr supports musculoskeletal, orthopedic,
  and stroke rehabilitation, acquired brain injury recovery, outpatient therapy, Remote
  Therapeutic Monitoring, and hybrid or virtual care pathways. The company does not
  currently publish a public developer API or developer program.
